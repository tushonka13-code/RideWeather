<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Better Amazon Search</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#18202a}main{max-width:900px;margin:40px auto;padding:20px}h1{font-size:32px}.search{display:flex;gap:10px}.search input{flex:1;padding:15px;font-size:18px;border:1px solid #bbb;border-radius:8px}.search button{padding:0 22px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:700;font-size:16px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin:12px 0}.stars{font-weight:700}.score{float:right;font-size:24px;font-weight:800}.note{color:#64748b;font-size:14px;margin:12px 0}.amazon{display:inline-block;margin-top:10px;background:#f59e0b;color:#111;padding:9px 12px;border-radius:7px;text-decoration:none;font-weight:700}</style></head><body><main><h1>Better Amazon Search</h1><p>Search products, then rank them by rating confidence instead of raw stars alone.</p><form class="search" id="f"><input id="q" name="q" type="search" placeholder="Try: natural shampoo under $20" autofocus><button type="submit">Search</button></form><div class="note" id="status">Enter a search to begin.</div><section id="results"></section></main><script>const products=[['Pure Nature Botanical Shampoo',4.8,3842,14.99],['EverClean Natural Daily Shampoo',4.7,12450,11.99],['Forest & Field Gentle Shampoo',4.9,214,18.99],['EarthSimple Sulfate-Free Shampoo',4.6,7821,16.49],['Botanical Balance Shampoo',4.8,967,12.49]];function lb(r,n){const p=r/5,z=1.96,d=1+z*z/n,c=p+z*z/(2*n),s=z*Math.sqrt((p*(1-p)+z*z/(4*n))/n);return Math.max(0,(c-s)/d)*5}function render(q){q=q.trim().toLowerCase();if(!q){document.getElementById('status').textContent='Enter a search to begin.';document.getElementById('results').innerHTML='';return}let a=products.filter(p=>p[0].toLowerCase().includes(q.split(/\s+/).find(w=>w.length>3)||'___'));if(!a.length)a=products.slice();a.sort((x,y)=>lb(y[1],y[2])-lb(x[1],x[2]));document.getElementById('status').textContent='Demo results for: '+q+' — live Amazon catalog connection is the next step.';document.getElementById('results').innerHTML=a.map((p,i)=>{let l=lb(p[1],p[2]);return `<div class="card"><span class="score">${l.toFixed(2)} confidence</span><b>${i+1}. ${p[0]}</b><div class="stars">★ ${p[1]} (${p[2].toLocaleString()} reviews)</div><div>$${p[3].toFixed(2)}</div><a class="amazon" href="https://www.amazon.com/s?k=${encodeURIComponent(q)}" target="_blank" rel="noopener">View Amazon search</a></div>`}).join('')}document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('q').value;history.replaceState(null,'','?q='+encodeURIComponent(q));render(q)});const q=new URLSearchParams(location.search).get('q');if(q){document.getElementById('q').value=q;render(q)}</script></body></html>
