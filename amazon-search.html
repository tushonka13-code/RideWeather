<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Better Amazon Search</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#18202a}main{max-width:980px;margin:40px auto;padding:20px}h1{font-size:32px}.search{display:flex;gap:10px}.search input{flex:1;padding:15px;font-size:18px;border:1px solid #bbb;border-radius:8px}.search button{padding:0 22px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:700;font-size:16px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin:12px 0}.stars{font-weight:700}.score{float:right;font-size:24px;font-weight:800}.note{color:#64748b;font-size:14px;margin:12px 0}.amazon{display:inline-block;margin-top:10px;background:#f59e0b;color:#111;padding:9px 12px;border-radius:7px;text-decoration:none;font-weight:700}.chips{margin:12px 0}.chip{display:inline-block;background:#e8eef8;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}</style></head><body><main><h1>Better Amazon Search</h1><p>Search first. Rank second. Never substitute an unrelated product.</p><form class="search" id="f"><input id="q" name="q" type="search" placeholder="Try: highest rated chef knife" autofocus><button type="submit">Search</button></form><div class="note" id="status">Try a search such as <b>chef knife</b>, <b>coffee grinder</b>, or <b>natural shampoo</b>.</div><div class="chips"><span class="chip">Chef knife</span><span class="chip">Coffee grinder</span><span class="chip">Natural shampoo</span></div><section id="results"></section></main><script>const products=[['Mercer Culinary 8-Inch Chef Knife','chef knife',4.7,18234,29.99],['Victorinox Fibrox Pro 8-Inch Chef Knife','chef knife',4.8,21456,44.95],['Tojiro DP Gyuto Chef Knife 210mm','chef knife',4.7,3821,89.99],['Varia VS4 Grinder','coffee grinder',4.6,921,299.00],['Baratza Encore ESP Grinder','coffee grinder',4.7,6340,199.95],['Timemore C3 Grinder','coffee grinder',4.6,5120,79.99],['Pure Nature Botanical Shampoo','natural shampoo',4.8,3842,14.99],['EverClean Natural Daily Shampoo','natural shampoo',4.7,12450,11.99],['Forest & Field Gentle Shampoo','natural shampoo',4.9,214,18.99]];function lb(r,n){const p=r/5,z=1.96,d=1+z*z/n,c=p+z*z/(2*n),s=z*Math.sqrt((p*(1-p)+z*z/(4*n))/n);return Math.max(0,(c-s)/d)*5}function intent(q){const s=q.toLowerCase();if(/chef|kitchen knife|gyuto|cook(ing)? knife/.test(s))return'chef knife';if(/coffee|espresso|burr grinder|grinder/.test(s))return'coffee grinder';if(/shampoo|hair wash|hair cleanser/.test(s))return'natural shampoo';return null}function render(q){q=q.trim();const i=intent(q);if(!q){document.getElementById('status').textContent='Enter a search.';document.getElementById('results').innerHTML='';return}if(!i){document.getElementById('status').innerHTML='No product category recognized in this demo. <b>No unrelated products are being shown.</b>';document.getElementById('results').innerHTML='<div class="card">Live Amazon search is the next step. This prototype intentionally refuses to show unrelated products when it cannot identify the category.</div>';return}let a=products.filter(p=>p[1]===i);a.sort((x,y)=>lb(y[2],y[3])-lb(x[2],x[3]));document.getElementById('status').textContent='Showing '+i+' results for: '+q+' — ranked by confidence-adjusted rating.';document.getElementById('results').innerHTML=a.map((p,n)=>{const l=lb(p[2],p[3]);return `<div class="card"><span class="score">${l.toFixed(2)} / 5 confidence</span><b>${n+1}. ${p[0]}</b><div class="stars">★ ${p[2].toFixed(1)} (${p[3].toLocaleString()} reviews)</div><div>$${p[4].toFixed(2)}</div><a class="amazon" href="https://www.amazon.com/s?k=${encodeURIComponent(q)}" target="_blank" rel="noopener">View Amazon</a></div>`}).join('')}document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();render(document.getElementById('q').value)});document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.getElementById('q').value=c.textContent;render(c.textContent)}));const q=new URLSearchParams(location.search).get('q');if(q){document.getElementById('q').value=q;render(q)}</script></body></html>
