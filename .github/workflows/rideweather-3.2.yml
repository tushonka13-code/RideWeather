name: RideWeather 3.2 UI patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rr-3.2-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RideWeather
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='src="rocketride-logo.png"'
          if old in s:
              s=s.replace(old,'src="rocketride-logo.svg"',1)
          marker='<!-- RR-3.2 UI PATCH -->'
          if marker not in s:
              patch=r'''
          <!-- RR-3.2 UI PATCH -->
          <style id="rocketride-32-final-ui">
          /* Keep the map clean and make the mobile controls deliberate rather than crowded. */
          @media(max-width:700px){
            .app-topbar{left:132px!important;right:8px!important;top:calc(8px + env(safe-area-inset-top))!important;height:50px!important}
            .app-actions{height:50px!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)!important;gap:6px!important}
            .app-actions button{min-height:46px!important;height:46px!important;border-radius:13px!important;font-size:12px!important;padding:7px 4px!important}
            .map-brand{left:8px!important;top:calc(8px + env(safe-area-inset-top))!important;width:116px!important;height:46px!important}
            .map-brand img{width:116px!important;max-width:116px!important;max-height:46px!important}
          }
          </style>
          <script id="rocketride-32-location-fix">
          (function(){
            const byId=id=>document.getElementById(id);
            function suppressNav(){
              const n=byId('navOverlay');
              window.rocketRideLocationOnlyMode=true;
              window.rocketRideLocationAccessActive=true;
              document.body.classList.add('rr-location-only');
              if(n){n.classList.remove('open');n.classList.add('rr-location-suppressed');}
            }
            function releaseNav(){
              const n=byId('navOverlay');
              window.rocketRideLocationOnlyMode=false;
              window.rocketRideLocationAccessActive=false;
              document.body.classList.remove('rr-location-only');
              n?.classList.remove('rr-location-suppressed');
              n?.classList.remove('open');
            }
            window.rocketRideEnterLocationOnly=suppressNav;
            window.rocketRideExitLocationOnly=releaseNav;
            window.locateUser=function(setStart){
              suppressNav();
              if(!navigator.geolocation){
                releaseNav();
                if(typeof setMapStatus==='function')setMapStatus('Location is not available in this browser.');
                return;
              }
              if(typeof setMapStatus==='function')setMapStatus('Getting your current location…');
              navigator.geolocation.getCurrentPosition(function(pos){
                const c={lat:pos.coords.latitude,lon:pos.coords.longitude,name:'Current location',source:'GPS'};
                currentLocationCoords=c;
                map.setView([c.lat,c.lon],15,{animate:true});
                if(!navMarker)navMarker=L.circleMarker([c.lat,c.lon],{radius:8,weight:3,fillOpacity:.95}).addTo(map).bindTooltip('You',{permanent:false});
                else navMarker.setLatLng([c.lat,c.lon]);
                if(!navAccuracy)navAccuracy=L.circle([c.lat,c.lon],{radius:pos.coords.accuracy||30,weight:1,fillOpacity:.08}).addTo(map);
                else navAccuracy.setLatLng([c.lat,c.lon]).setRadius(pos.coords.accuracy||30);
                if(setStart){
                  currentStartCoords=c;
                  byId('start').value='Current location';
                  byId('card').classList.add('open');
                }
                releaseNav();
                if(typeof setMapStatus==='function')setMapStatus(setStart?'Current location set as start.':'Showing your current location.');
              },function(err){
                releaseNav();
                if(typeof setMapStatus==='function')setMapStatus('Could not get your location: '+(err.message||'permission denied'));
              },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
            };
            document.addEventListener('visibilitychange',function(){
              if(document.visibilityState==='visible' && window.rocketRideLocationAccessActive){
                const n=byId('navOverlay');
                n?.classList.remove('open');
              }
            },true);
          })();
          </script>
          '''
              s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix mobile location flow and polish UI [rr-3.2-patch]"
          git push
