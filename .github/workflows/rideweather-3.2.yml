name: RideWeather 3.2 UI patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rr-3.4-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install final navigation and mobile behavior patches
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          nav_marker='<!-- RR-FINAL-NAV-DISMISS-2026-08-17 -->'
          if nav_marker not in s:
              patch=r'''<!-- RR-FINAL-NAV-DISMISS-2026-08-17 -->
          <style id="rr-final-nav-dismiss-css">
          body.rr-user-dismissed-nav #navOverlay{display:none!important;visibility:hidden!important;pointer-events:none!important}
          </style>
          <script id="rr-final-nav-dismiss-js">
          (function(){
            var dismissed=false;
            function nav(){return document.getElementById('navOverlay')}
            function hide(){
              var n=nav();
              if(n){n.classList.remove('open');n.setAttribute('aria-hidden','true')}
              document.body.classList.add('rr-user-dismissed-nav');
            }
            function release(){
              dismissed=false;
              document.body.classList.remove('rr-user-dismissed-nav');
              var n=nav();
              if(n)n.removeAttribute('aria-hidden');
            }
            function isCloseButton(b){
              if(!b)return false;
              var id=(b.id||'').toLowerCase();
              var text=((b.textContent||'')+' '+(b.getAttribute('aria-label')||'')+' '+(b.getAttribute('title')||'')).trim().toLowerCase();
              return id==='overlayclose' || text==='close' || text==='close navigation' || text==='x' || text==='×';
            }
            function isStartButton(b){
              if(!b)return false;
              var id=(b.id||'').toLowerCase();
              var text=((b.textContent||'')+' '+(b.getAttribute('aria-label')||'')+' '+(b.getAttribute('title')||'')).trim().toLowerCase();
              return id==='overlaystartnav' || text.indexOf('start navigation')>=0;
            }
            function dismiss(){
              dismissed=true;
              try{navHudAllowed=false;}catch(e){}
              hide();
            }
            function start(){
              release();
              try{navHudAllowed=true;}catch(e){}
            }
            document.addEventListener('pointerup',function(e){
              var b=e.target.closest&&e.target.closest('#overlayClose,#overlayStartNav');
              if(isCloseButton(b)){
                e.preventDefault();e.stopImmediatePropagation();dismiss();
              }else if(isStartButton(b)){start();}
            },true);
            document.addEventListener('click',function(e){
              var b=e.target.closest&&e.target.closest('#overlayClose,#overlayStartNav');
              if(isCloseButton(b)){
                e.preventDefault();e.stopImmediatePropagation();dismiss();
              }else if(isStartButton(b)){start();}
            },true);
            var obs=new MutationObserver(function(){if(dismissed)hide()});
            function install(){
              var root=document.documentElement;
              if(root)obs.observe(root,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style','aria-hidden']});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
          })();
          </script>
          '''
              s=s.replace('</body>',patch+'\n</body>')

          mobile_marker='<!-- RR-ROUTE-MOBILE-2026-08-17 -->'
          if mobile_marker not in s:
              mobile_css=r'''<!-- RR-ROUTE-MOBILE-2026-08-17 -->
          <style id="rr-route-mobile-fix">
          @media(max-width:700px){
            .app-topbar{left:8px!important;right:8px!important;top:8px!important;width:auto!important;overflow:visible!important;box-sizing:border-box!important}
            .app-actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;width:100%!important}
            .app-actions button{width:100%!important;min-width:0!important;max-width:none!important;min-height:44px!important;height:44px!important;padding:8px 5px!important;margin:0!important;border-radius:12px!important;font-size:12px!important;line-height:1.05!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}
            .route-choice.primary-access{width:100%!important;box-sizing:border-box!important;padding:12px!important;overflow:hidden!important}
            .route-choice.primary-access .route-choice-head{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:9px!important}
            .route-choice.primary-access .route-find{width:100%!important;min-width:0!important;box-sizing:border-box!important;min-height:44px!important;padding:10px 12px!important;font-size:14px!important;border-radius:10px!important;white-space:nowrap!important}
            .route-list{width:100%!important;box-sizing:border-box!important;overflow:visible!important}
            .route-option{position:relative!important;display:block!important;width:100%!important;min-width:0!important;box-sizing:border-box!important;min-height:76px!important;padding:12px 112px 12px 12px!important;border-radius:12px!important;overflow:hidden!important;white-space:normal!important;line-height:1.25!important}
            .route-option .route-tag{position:absolute!important;top:10px!important;right:10px!important;float:none!important;max-width:88px!important;box-sizing:border-box!important;padding:4px 6px!important;border-radius:8px!important;font-size:10px!important;line-height:1.1!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
            .route-option .route-meta{font-size:12px!important;line-height:1.3!important;overflow-wrap:anywhere!important}
            .nav-secondary-actions{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important}
            .nav-secondary-actions button{width:100%!important;min-width:0!important;max-width:none!important;min-height:44px!important;height:44px!important;padding:7px 4px!important;border-radius:10px!important;font-size:12px!important;line-height:1.05!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;box-sizing:border-box!important}
            .nav-primary-action,.nav-primary-action button{width:100%!important;box-sizing:border-box!important}
            .nav-primary-action button{min-height:48px!important;border-radius:12px!important;white-space:nowrap!important}
            #card .route-row-actions button{min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
          }
          .route-option{position:relative!important;box-sizing:border-box!important;overflow:hidden!important;white-space:normal!important;padding-right:112px!important}
          .route-option .route-tag{float:none!important;position:absolute!important;top:10px!important;right:10px!important}
          </style>
          '''
              s=s.replace('</head>',mobile_css+'\n</head>')

          guard_marker='<!-- RR-POST-ROUTE-HUD-GUARD-2026-08-17 -->'
          if guard_marker not in s:
              guard=r'''<!-- RR-POST-ROUTE-HUD-GUARD-2026-08-17 -->
          <script>
          (function(){
            function keepHudClosedUnlessNavigating(){
              var n=document.getElementById('navOverlay');
              if(!n)return;
              if(!window.navActive){
                n.classList.remove('open');
                n.setAttribute('aria-hidden','true');
              }
            }
            var original=window.updateNextTurnOverlay;
            if(typeof original==='function'){
              window.updateNextTurnOverlay=function(activeIndex,distOverride,openHud){
                if(!window.navActive) openHud=false;
                return original.call(this,activeIndex,distOverride,openHud);
              };
            }
            document.addEventListener('DOMContentLoaded',keepHudClosedUnlessNavigating,{once:true});
            setTimeout(keepHudClosedUnlessNavigating,0);
          })();
          </script>
          '''
              s=s.replace('</body>',guard+'\n</body>')

          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Post-route HUD guard and mobile controls [rr-3.4-patch]"
          git push
