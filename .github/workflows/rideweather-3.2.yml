name: RideWeather 3.2 UI patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rr-3.2-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RideWeather
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='src="rocketride-logo.png"'
          if old in s:
              s=s.replace(old,'src="rocketride-logo.svg"',1)
          # Persistent close guard: if the user explicitly closes the navigation HUD,
          # suppress any delayed legacy handler from reopening it. A fresh Start Navigation
          # click is outside the HUD and is therefore unaffected.
          marker5='/* RR-3.2.4 NAV CLOSE GUARD */'
          if marker5 not in s:
              patch5=r'''<!-- RR-3.2.4 NAV CLOSE GUARD -->
          <style id="rocketride-324-nav-close-guard">
          body.rr-nav-closed #navOverlay{display:none!important;visibility:hidden!important;pointer-events:none!important}
          </style>
          <script id="rocketride-324-nav-close-guard-js">
          (function(){
            let closedUntil=0;
            function nav(){return document.getElementById('navOverlay')}
            function hide(){
              const n=nav();
              if(n){n.classList.remove('open');n.style.display='none';}
              document.body.classList.add('rr-nav-closed');
            }
            function release(){
              if(Date.now()>=closedUntil){
                document.body.classList.remove('rr-nav-closed');
                const n=nav();
                if(n)n.style.removeProperty('display');
              }
            }
            document.addEventListener('click',function(e){
              const n=e.target.closest?.('#navOverlay');
              if(!n)return;
              const b=e.target.closest?.('button,[role="button"]');
              if(!b)return;
              const text=(b.textContent||'').trim().toLowerCase();
              const label=((b.getAttribute('aria-label')||'')+' '+(b.getAttribute('title')||'')).toLowerCase();
              const isClose=text==='close' || text.includes('close') || label.includes('close') || b.classList.contains('panel-close') || b.classList.contains('nav-close');
              if(!isClose)return;
              closedUntil=Date.now()+5000;
              hide();
              requestAnimationFrame(hide);
              setTimeout(hide,25);
              setTimeout(hide,100);
              setTimeout(hide,500);
              setTimeout(hide,1500);
              setTimeout(hide,3000);
              setTimeout(release,5100);
            },true);
            const observer=new MutationObserver(function(){
              if(Date.now()<closedUntil)hide();
            });
            observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});
          })();
          </script>
          '''
              s=s.replace('</body>',patch5+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stop navigation HUD reopening after close [rr-3.2-patch]"
          git push
