name: RideWeather 3.2 UI patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rr-3.2-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RideWeather
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='src="rocketride-logo.png"'
          if old in s:
              s=s.replace(old,'src="rocketride-logo.svg"',1)
          marker='<!-- RR-3.2 UI PATCH -->'
          if marker not in s:
              patch=r'''<!-- RR-3.2 UI PATCH -->
          <style id="rocketride-32-final-ui">
          @media(max-width:700px){
            .app-topbar{left:132px!important;right:8px!important;top:calc(8px + env(safe-area-inset-top))!important;height:50px!important;width:auto!important;overflow:visible!important}
            .app-actions{height:50px!important;width:100%!important;max-width:100%!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important;overflow:visible!important}
            .app-actions button{min-width:0!important;width:100%!important;min-height:46px!important;height:46px!important;box-sizing:border-box!important;border-radius:13px!important;font-size:10px!important;line-height:1.05!important;font-weight:900!important;padding:4px 2px!important;overflow:visible!important;text-overflow:clip!important;white-space:normal!important;word-break:normal!important}
            .map-brand{left:8px!important;top:calc(8px + env(safe-area-inset-top))!important;width:116px!important;height:46px!important}
            .map-brand img{width:116px!important;max-width:116px!important;max-height:46px!important}
            .card{left:8px!important;right:8px!important;width:auto!important;max-width:none!important;box-sizing:border-box!important;overflow-x:hidden!important}
            .card .plan-section{width:100%!important;box-sizing:border-box!important;padding-left:14px!important;padding-right:14px!important;overflow:visible!important}
            .card .route-field,.card .stop-row,.card .route-field-main{min-width:0!important;max-width:100%!important;box-sizing:border-box!important}
            .card .route-field-main .input-action-row{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:7px!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important}
            .card .route-field-main .input-action-row .field{grid-column:1 / -1!important;min-width:0!important;width:100%!important}
            .card .route-field-main .input-action-row .field input{width:100%!important;min-width:0!important;max-width:100%!important;box-sizing:border-box!important}
            .card .route-field-main .input-action-row button{grid-column:auto!important;grid-row:auto!important;width:100%!important;min-width:0!important;max-width:100%!important;height:42px!important;box-sizing:border-box!important;padding:4px 5px!important;font-size:11px!important;line-height:1.05!important;white-space:normal!important;overflow:visible!important}
            .card .route-field-main .input-action-row .save-btn{grid-column:auto!important;grid-row:auto!important}
            .card .stop-row .input-action-row{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:7px!important}
            .card .stop-row .input-action-row .field{grid-column:1 / -1!important;min-width:0!important}
            .card .stop-row .input-action-row button{width:100%!important;min-width:0!important;max-width:100%!important;font-size:11px!important;white-space:normal!important}
            .card .add-stop-btn{width:calc(100% - 39px)!important;max-width:calc(100% - 39px)!important;box-sizing:border-box!important;white-space:normal!important}
            .plan-header{gap:10px!important;padding:14px 14px 12px!important}
            .plan-header h2{font-size:21px!important}
            .plan-subtitle{font-size:12px!important}
            .plan-header .panel-close{flex:0 0 54px!important;width:54px!important}
            .section-title{font-size:15px!important}
            .plan-footer{padding:10px 14px!important}
            .calculate-btn{width:100%!important;min-width:0!important}
          }
          </style>
          <script id="rocketride-32-location-fix">
          (function(){
            const byId=id=>document.getElementById(id);
            let locationFixActive=false;
            function suppressNav(){
              locationFixActive=true;
              window.rocketRideLocationOnlyMode=true;
              window.rocketRideLocationAccessActive=true;
              document.body.classList.add('rr-location-only');
              const n=byId('navOverlay');
              if(n){n.classList.remove('open');n.classList.add('rr-location-suppressed');}
            }
            function releaseNav(){
              locationFixActive=false;
              window.rocketRideLocationOnlyMode=false;
              window.rocketRideLocationAccessActive=false;
              document.body.classList.remove('rr-location-only');
              const n=byId('navOverlay');
              if(n){n.classList.remove('rr-location-suppressed');n.classList.remove('open');}
            }
            window.rocketRideEnterLocationOnly=suppressNav;
            window.rocketRideExitLocationOnly=releaseNav;
            window.rocketRideLocationFixActive=()=>locationFixActive;
            document.addEventListener('click',e=>{
              const b=e.target.closest?.('#locateBtn,#useCurrentStart,#mapLocateFab');
              if(b)suppressNav();
            },true);
            const obs=new MutationObserver(()=>{
              if(!locationFixActive)return;
              const n=byId('navOverlay');
              if(n){n.classList.remove('open');n.classList.add('rr-location-suppressed');}
            });
            obs.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','style']});
          })();
          </script>
          '''
              s=s.replace('</body>',patch+'\n</body>')
          marker2='/* RR-3.2.1 MOBILE FIT */'
          if marker2 not in s:
              patch2=r'''<!-- RR-3.2.1 MOBILE FIT -->
          <style id="rocketride-321-mobile-fit">
          @media(max-width:700px){
            html,body{width:100%!important;max-width:100%!important;overflow:hidden!important}
            #map{width:100%!important;max-width:100%!important}
            .app-topbar{left:132px!important;right:8px!important;width:auto!important;overflow:visible!important}
            .app-actions{width:100%!important;max-width:100%!important;grid-template-columns:repeat(3,minmax(0,1fr))!important}
            .app-actions button{box-sizing:border-box!important}
            .card{right:8px!important;overflow-x:hidden!important}
            .card .plan-section,.card .route-field-main,.card .input-action-row{box-sizing:border-box!important}
          }
          </style>
          '''
              s=s.replace('</body>',patch2+'\n</body>')
          marker3='/* RR-3.2.2 LOCATION HUD GUARD */'
          if marker3 not in s:
              patch3=r'''<!-- RR-3.2.2 LOCATION HUD GUARD -->
          <style id="rocketride-322-location-guard">
          body.rr-location-only #navOverlay,#navOverlay.rr-location-suppressed{display:none!important;visibility:hidden!important;pointer-events:none!important}
          </style>
          <script id="rocketride-322-location-guard-js">
          (function(){
            let until=0;
            document.addEventListener('click',function(e){
              const b=e.target.closest?.('#locateBtn,#useCurrentStart,#mapLocateFab');
              if(b)until=Date.now()+20000;
            },true);
            const observer=new MutationObserver(function(){
              if(Date.now()>until)return;
              const n=document.getElementById('navOverlay');
              if(n){n.classList.remove('open');n.classList.add('rr-location-suppressed');}
              document.body.classList.add('rr-location-only');
            });
            observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});
            window.addEventListener('pageshow',()=>{until=0;document.body.classList.remove('rr-location-only');document.getElementById('navOverlay')?.classList.remove('rr-location-suppressed','open');},true);
          })();
          </script>
          '''
              s=s.replace('</body>',patch3+'\n</body>')
          marker4='<!-- RR-3.2.3 MOBILE LAYOUT -->'
          if marker4 not in s:
              patch4=r'''<!-- RR-3.2.3 MOBILE LAYOUT -->
          <style id="rocketride-323-mobile-layout">
          @media(max-width:700px){
            /* The phone viewport is too narrow for the desktop action-row layout. Stack the text field, then use two readable buttons per row. */
            .card .route-field-main .input-action-row,
            .card .stop-row .input-action-row{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;align-items:stretch!important}
            .card .route-field-main .input-action-row .field,
            .card .stop-row .input-action-row .field{grid-column:1/-1!important}
            .card .route-field-main .input-action-row button,
            .card .stop-row .input-action-row button{width:100%!important;min-width:0!important;height:44px!important;padding:5px 6px!important;font-size:11px!important;line-height:1.05!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important}
            .card .route-field-main .input-action-row button.location-btn,
            .card .route-field-main .input-action-row button.save-btn{grid-row:auto!important;grid-column:auto!important}
            .card .route-field-main .input-action-row .field input{height:46px!important;font-size:16px!important}
            .card .plan-section{overflow:visible!important}
            /* Force the three map-header actions to fit the actual phone width and never clip their labels. */
            .app-topbar{left:130px!important;right:7px!important;width:auto!important;height:52px!important;overflow:visible!important;display:block!important}
            .app-actions{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:4px!important;width:100%!important;height:52px!important;overflow:visible!important}
            .app-actions button{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:50px!important;min-width:0!important;min-height:50px!important;padding:3px 1px!important;font-size:10px!important;line-height:1.05!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;word-break:normal!important}
            .card .section-title{margin-bottom:10px!important}
            .card .route-field,.card .stop-row{grid-template-columns:26px minmax(0,1fr)!important;gap:8px!important}
            .card .route-dot{width:22px!important;height:22px!important}
            .card .add-stop-btn{margin-left:34px!important;width:calc(100% - 34px)!important}
          }
          </style>
          '''
              s=s.replace('</body>',patch4+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve mobile route controls and readable header buttons [rr-3.2-patch]"
          git push
