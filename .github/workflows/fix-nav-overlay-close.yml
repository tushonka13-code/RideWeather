name: Fix navigation overlay close

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch navigation overlay behavior and initial route speed
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Persistent user dismissal. This does not depend on the existing close handler's exact formatting.
          patch = r'''<script id="rr-nav-user-dismiss-fix">
          (function(){
            let dismissed=false;
            const nav=()=>document.getElementById('navOverlay');
            const hide=()=>{const n=nav();if(n){n.classList.remove('open');n.setAttribute('aria-hidden','true')}};
            const show=()=>{dismissed=false;const n=nav();if(n)n.removeAttribute('aria-hidden')};
            document.addEventListener('click',function(e){
              const n=nav(), b=e.target.closest?.('button,[role="button"]');
              if(!b)return;
              if(n&&n.contains(b)){
                const t=((b.textContent||'')+' '+(b.getAttribute('aria-label')||'')).trim().toLowerCase();
                if(t.includes('close')||t==='x'||t==='×'){dismissed=true;hide();return;}
              }
              if(dismissed && ((b.id||'').toLowerCase().includes('startnav') || (b.textContent||'').toLowerCase().includes('start navigation')))show();
            },true);
            const obs=new MutationObserver(()=>{if(dismissed)hide()});
            obs.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style','aria-hidden']});
          })();
          </script>'''
          if 'id="rr-nav-user-dismiss-fix"' not in s:
              s=s.replace('</body>',patch+'\n</body>')

          # Faster initial route response: one alternate is enough for the primary calculation.
          if "alternates:2," in s:
              s=s.replace("alternates:2,","alternates:1,",1)
          if "const requestTimeout=Number(opts.timeoutMs||8000);" in s:
              s=s.replace("const requestTimeout=Number(opts.timeoutMs||8000);","const requestTimeout=Number(opts.timeoutMs||6500);",1)

          p.write_text(s,encoding='utf-8')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-nav-overlay-close.yml
          git commit -m "Fix navigation close and speed initial route calculation [rr-3.2-patch]"
          git push
