name: Fix navigation overlay close

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch navigation overlay close state
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "let navHudAllowed=false;"
          new = "let navHudAllowed=false; let navHudDismissed=false;"
          if old not in s:
              raise SystemExit('Could not find navigation state declaration')
          s = s.replace(old, new, 1)

          old = "function startNavigation(){\n"
          new = "function startNavigation(){\n  navHudDismissed=false;\n"
          if old not in s:
              raise SystemExit('Could not find startNavigation')
          s = s.replace(old, new, 1)

          old = "function stopNavigation(){\n"
          new = "function stopNavigation(){\n  navHudDismissed=true;\n"
          if old not in s:
              raise SystemExit('Could not find stopNavigation')
          s = s.replace(old, new, 1)

          old = "function updateNextTurnOverlay(activeIndex=navLastManeuver,distOverride=null,openHud=true){\n"
          new = "function updateNextTurnOverlay(activeIndex=navLastManeuver,distOverride=null,openHud=true){\n  if(navHudDismissed)openHud=false;\n"
          if old not in s:
              raise SystemExit('Could not find updateNextTurnOverlay')
          s = s.replace(old, new, 1)

          old = "}else if(id==='overlayClose'){\n        document.getElementById('navOverlay')?.classList.remove('open');\n      }"
          new = "}else if(id==='overlayClose'){\n        navHudDismissed=true;\n        document.getElementById('navOverlay')?.classList.remove('open');\n      }"
          if old not in s:
              raise SystemExit('Could not find overlayClose handler')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-nav-overlay-close.yml
          git commit -m "Fix navigation overlay closing" 
          git push
